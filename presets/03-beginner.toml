# Beginner: FFR's Beginner.json (docs/ffr-presets.md has the comparison).
# FFR's stats roll 70-150% per enemy, HP with them; our dials step by 25%,
# so 75-150%.  FFR has 60% encounters outdoors and 70% in dungeons; our
# dial is one rate.
name = "Beginner"
description = """
Shops, chests, magic, enemies and key items are shuffled, and the BRIDGE
is free.
"""

[settings]
# Scale
"Gold and XP" = "250%"
"Encounter rate" = "60%"
"Enemy stats min" = "75%"               # FFR's 70%
"Enemy stats max" = "150%"
"Enemy HP min" = "75%"                  # FFR's HP follows the stats
"Enemy HP max" = "150%"
"Boss stats min" = "75%"
"Boss stats max" = "150%"
"Boss HP min" = "75%"
"Boss HP max" = "150%"
"Elemental bonus" = "+30"

# Quality of life
"Lefein Inn and Clinic" = true          # FFR's LefeinShops
"Lefein SuperStore" = true              # FFR's LefeinSuperStore

# Variations
"Better Thief and Ninja" = true
"Thief and Ninja hit%" = "+4"           # FFR's Double
"Thief lockpicking" = "Lv15"
"Double weapon crit" = true
"Improved CURE and HEAL" = true
"Cast Life in battle" = true
"SOFT in battle" = true
"White Mage HARM" = true
"LOK2 accuracy" = true                  # FFR's LockMode 3, Auto Hit
"RUSE Staff" = true                     # FFR's guaranteed defense item, RUSE

# Treasures
"Starting items" = "Explorer"

# Randomization
"Trap tiles" = "Shuffle"
"Shops" = "Shuffle"
"Chests" = "Shuffle"
"Magic levels" = "Shuffle"
"Max gear blessing" = "+5"
"Min gear curse" = "-3"
"Formation rarity" = "Shuffle"
"Unrunnable fights" = "Shuffle"
"Surprise rates" = "Shuffle"
"Status attacks" = "Shuffle"            # FFR's is Randomize; ours offers Shuffle
"Enemy scripts" = "Both"
"Enemy skills" = "Both"
"RNG tables" = "Shuffle"
"Ordeals pillars" = "Shuffle"

# Key items
"Key items" = "Standard"
"BRIDGE" = "Free"
"Masmune" = "Incentive"
"Ribbon" = "Incentive"
"Early King" = "On"
"Early Sarda" = "On"
"Early Sage" = "On"
"Early Ordeals" = "On"

[map_edits]
"Early Open" = true                     # FFR's MapOpenProgression
