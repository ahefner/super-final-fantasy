# Floaterless: FFR's Floaterless.json.  Beginner with no FLOATER (NoFloater),
# the Opal an incentive, and seven map edits: Early Open Progression, which
# Beginner's row gives, and six more.  Not on the cartridge: Bahamut's
# Hoard, Cardia's chests moved behind Bahamut where the ship reaches them.
# FFR has 33% encounters outdoors and 70% in dungeons; the one dial takes
# 40%.
name = "Floaterless"
inherit = "Beginner"
description = """
Beginner without the FLOATER, so no airship. Map edits open the world to
the ship and canoe, and the Opal is an incentive.
"""

[settings]
"AIRSHIP" = "Remove"
"Opal" = "Incentive"
"Encounter rate" = "40%"

[map_edits]                             # and Beginner's Early Open
"Extended Open" = true                  # MapOpenProgressionExtended
"North Docks" = true                    # MapOpenProgressionDocks
"Ryukahn Dock" = true                   # MapAirshipDock
"Bahamut Dock" = true                   # MapBahamutCardiaDock
"Lefein River" = true                   # MapLefeinRiver
"Gaia Pass" = true                      # MapGaiaMountainPass
