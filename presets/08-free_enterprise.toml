# Free Enterprise: FFR's Free_Enterprise.json, without its recruitment
# (user) -- so without the party it builds by recruiting.  Not yet on the
# cartridge: its alternate fiends and final boss, buffed Astos and Bahamut,
# WarMECH guarding Tiamat, the guarded Masamune, better trap chests,
# random loot, Thor's Hammer, the Black Shirt and the Power Rod as
# incentives (docs/ffr-presets.md, 3.5).
name = "Free Enterprise"
inherit = "Beginner"
description = """
Beginner with Wide key items, incentive gear, free vehicles, no random
battles, and a casting item to start.
"""

[settings]
"Gold and XP" = "300%"
"Encounter rate" = "Off"
"Boss HP min" = "75%"                   # FFR's 80-240%, to our 25% steps
"Boss HP max" = "250%"
"Short ToFR" = true
"Starting caster item" = "AoE"          # FFR's StartingEquipmentRandomAoe
"Trap tiles" = "B"
"Enemy skills" = "Enemies"
"Pirates" = "Nasty"                    # FFR's SwolePirates and AllowUnsafePirates
"Key items" = "Wide"

"SHIP" = "Free"
"AIRSHIP" = "Free"
"CANAL" = "Free"
"CANOE" = "Free"
"TAIL" = "Free"

"Masmune" = "Treasure"                  # FFR guarantees it, guarded, instead
"Katana" = "Incentive"
"Vorpal" = "Incentive"
"Defense" = "Incentive"
"Opal" = "Incentive"
"Power" = "Incentive"
"White" = "Incentive"
"Xcalber" = "Incentive"
