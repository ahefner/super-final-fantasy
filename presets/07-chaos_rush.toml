# Chaos Rush: FFR's Chaos_Rush.json.  Not yet on the cartridge: the
# unlocked Temple of Fiends Revisited (ChaosRush) and the Red Mage hit buff
# (docs/ffr-presets.md, 3.5).
name = "Chaos Rush"
inherit = "Beginner"
description = """
A fast Beginner. Chaos needs no orbs, most vehicles and the LUTE are
free, gold and XP are 500%, and fights are few.
"""

[settings]
"Gold and XP" = "500%"
"Encounter rate" = "30%"
"Short ToFR" = true
"Goal" = "0 orbs"                       # FFR's OrbsRequiredCount 0
"Party" = "4 Forced"                    # FFR's four forced random slots (user)

"SHIP" = "Free"
"AIRSHIP" = "Free"                      # the FLOATER
"CANAL" = "Free"
"CANOE" = "Free"
"TAIL" = "Free"
"LUTE" = "Free"

"Katana" = "Incentive"
"Vorpal" = "Incentive"
"Defense" = "Incentive"                 # FFR's DefCastWeapon
"Opal" = "Incentive"
"Power" = "Incentive"                   # FFR's OtherCastArmor
"White" = "Incentive"                   # FFR's DefCastArmor
