# Link map for the SNES port.
#
# Every bank is emitted to its own file and build.sh assembles the ROM image by
# concatenation, exactly the way the NES build did.  That is what lets the
# fixed bank ($0F) be stamped into all sixteen chunks: a linker can only place
# a segment once, but sixteen copies of the same 16KB blob cost nothing.

MEMORY {
    ZP:      start = $0000,   size = $0100, type = rw, file = "";
    RAM:     start = $0800,   size = $1800, type = rw, file = "";

    MEM_HAL: start = $8000,   size = $7FB0, file = "out/hal.bin",     fill = yes, fillval = $00;
    MEM_HDR: start = $FFB0,   size = $0050, file = "out/hdr.bin",     fill = yes, fillval = $00;

    MEM_01:  start = $8000,   size = $4000, file = "out/bank_01.bin", fill = yes, fillval = $00;
    MEM_09:  start = $8000,   size = $4000, file = "out/bank_09.bin", fill = yes, fillval = $00;
    MEM_0B:  start = $8000,   size = $4000, file = "out/bank_0B.bin", fill = yes, fillval = $00;
    MEM_0C:  start = $8000,   size = $4000, file = "out/bank_0C.bin", fill = yes, fillval = $00;
    MEM_0D:  start = $8000,   size = $4000, file = "out/bank_0D.bin", fill = yes, fillval = $00;
    MEM_0E:  start = $8000,   size = $4000, file = "out/bank_0E.bin", fill = yes, fillval = $00;
    MEM_0F:  start = $C000,   size = $4000, file = "out/bank_0F.bin", fill = yes, fillval = $00;
    MEM_OPT: start = $8000,   size = $4000, file = "out/bank_OPT.bin", fill = yes, fillval = $00;
    MEM_CREDITS: start = $8000, size = $4000, file = "out/bank_CREDITS.bin", fill = yes, fillval = $00;
    MEM_RANDO: start = $8000, size = $4000, file = "out/bank_RANDO.bin", fill = yes, fillval = $00;
    MEM_OPTTEXT: start = $8000, size = $4000, file = "out/bank_OPTTEXT.bin", fill = yes, fillval = $00;
    MEM_LOGIC: start = $8000, size = $4000, file = "out/bank_LOGIC.bin", fill = yes, fillval = $00;
    MEM_WORLD: start = $8000, size = $4000, file = "out/bank_WORLD.bin", fill = yes, fillval = $00;
    MEM_ROLL: start = $8000, size = $4000, file = "out/bank_ROLL.bin", fill = yes, fillval = $00;
    MEM_TACTICS: start = $8000, size = $4000, file = "out/bank_TACTICS.bin", fill = yes, fillval = $00;
    MEM_OWS: start = $8000, size = $4000, file = "out/bank_OWS.bin", fill = yes, fillval = $00;
    MEM_NEWGAME: start = $8000, size = $4000, file = "out/bank_NEWGAME.bin", fill = yes, fillval = $00;
}

SEGMENTS {
    HALCODE:    load = MEM_HAL, type = ro;
    SNESHDR:    load = MEM_HDR, type = ro;
    BANK_01:    load = MEM_01,  type = ro, align = $4000;
    BANK_09:    load = MEM_09,  type = ro, align = $4000;
    BANK_0B:    load = MEM_0B,  type = ro, align = $4000;
    BANK_0C:    load = MEM_0C,  type = ro, align = $4000;
    BANK_0D:    load = MEM_0D,  type = ro, align = $4000;
    BANK_0E:    load = MEM_0E,  type = ro, align = $4000;
    BANK_FIXED: load = MEM_0F,  type = ro, align = $4000;
    BANK_OPT:   load = MEM_OPT, type = ro, align = $4000;
    BANK_CREDITS: load = MEM_CREDITS, type = ro, align = $4000;
    BANK_RANDO: load = MEM_RANDO, type = ro, align = $4000;
    BANK_OPTTEXT: load = MEM_OPTTEXT, type = ro, align = $4000;
    BANK_LOGIC: load = MEM_LOGIC, type = ro, align = $4000;
    BANK_WORLD: load = MEM_WORLD, type = ro, align = $4000;
    BANK_ROLL: load = MEM_ROLL, type = ro, align = $4000;
    BANK_TACTICS: load = MEM_TACTICS, type = ro, align = $4000;
    BANK_OWS: load = MEM_OWS, type = ro, align = $4000;
    BANK_NEWGAME: load = MEM_NEWGAME, type = ro, align = $4000;
}
